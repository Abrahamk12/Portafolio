<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ING Uriel Abraham</title>
  <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/idioma.js" defer></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>
<body>
  <header class="menu">
    <nav>
      <div class="menu-left">
        <ul>
          <li><a href="#menu" data-key="menu"></a></li>
          <li><a href="#sobre-mi" data-key="about"></a></li>
          <li><a href="#experiencia" data-key="experience"></a></li>
        </ul>
      </div>

      <img src="assets/img/profile-img.jpg" alt="Uriel Abraham" class="profile-img" id="toggle-menu">

      <div class="menu-right">
        <ul>
          <li><a href="#" data-key="projects"></a></li>
          <li><a href="#" data-key="resume"></a></li>
          <li><a href="#" data-key="contact"></a></li>
        </ul>
      </div>
    </nav>
    <div class="idioma-switch">
      <button data-lang="es">ES</button>
      <button data-lang="en">EN</button>
    </div>
    <div class="menu-movil" id="menu-movil">
      <ul>
        <li><a href="#menu" data-key="menu"></a></li>
        <li><a href="#sobre-mi" data-key="about"></a></li>
        <li><a href="#experiencia" data-key="experience"></a></li>
        <li><a href="#" data-key="projects"></a></li>
        <li><a href="#" data-key="resume"></a></li>
        <li><a href="#" data-key="contact"></a></li>
      </ul>
    </div>

  </section>

  <section class="sobre-mi" id="sobre-mi">
    <h1 data-key="about"></h1>
    <p data-key="about-text"> </p>
    <h2 data-key="skills"></h2>
    <p data-key="skills-text"></p>
  </section>

  <section class="experiencia skills section-bg skills section-bg" id="skills">
    <div class="lenguajes-programacion container" id="lenguajes-programacion">
      <div class="row skills-content">
        <h2 data-key="len-p"></h2>
          <div class="col-lg-6" data-aos="fade-up">

            <div class="progress">
              <span class="skill">HTML <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">CSS <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">JavaScript <i class="val">25%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">Python <i class="val">60%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">Java <i class="val">80%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
            
          </div>

          <div class="col-lg-6" data-aos="fade-up" data-aos-delay="100">
            <div class="progress">
              <span class="skill">SQL <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">MySQL <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">PostgreSQL <i class="val">25%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">Linux <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="progress">
              <span class="skill">C# <i class="val">50%</i></span>
              <div class="progress-bar-wrap">
                <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

          </div>

        </div>
    </div>
  </section>

  <footer>
    
  </footer>
</body>
<script src="/assets/js/principal.js" defer></script>
</html>
